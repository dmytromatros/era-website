# Holds up the home page headline (Dima, 2026-11-16: "Bohdan" — only that one; Max on
# "Who we are" stays Max). Looks like Max, plus a name badge so the name is seen.
name: Bohdan
role: 3D/AR lead
palette: { skin: "#d9a07b", shirt: "#3b6cf6", pants: "#1f2433", accent: "#7ee0c3", hair: "#141414" }
accessories: [headphones, badge]
# Click / tap: played in turn; `annoyed` after a few quick clicks (default: shrug 😤).
reactions:
  - { move: jump, emoji: "💪" }
  - { move: surprised, emoji: "😅" }
# Photo mode (E7): his hands hold the headline, so he just grins into the camera.
pose: { move: peace, emoji: "😁" }
