name: DFRNC
defaultLocale: en
locales: [en]
nav:
  en:
    - { label: Home, href: / }
    - { label: Who we are, href: /who-we-are }
    - { label: Contacts, href: /contacts }
# Right after the visitor falls into the 3D world from the 2D landing, a character walks up and
# offers a coffee (wow-plan D3). Once per page view; never on arriving through a portal or Back.
welcome:
  en:
    actor: mila
    lines:
      - "Whoa — you came right through the page! Are you okay?"
      - "First day? Here, have a coffee."
    take: "Take it ☕"
    decline: "No, thanks"
    thanks: "Welcome to DFRNC!"
    shrug: "Suit yourself 🙂"
# The entrance cutscene (fall → look at the hands → coffee): when it is over, a hint that the
# scroll is the visitor's again (mouse / touch screens).
cutscene:
  en:
    hint: "Scroll to continue"
    hintTouch: "Swipe to continue"
# The arcade machine in the office (wow-plan E3): its screen (pixel font — upper case, A–Z, 0–9
# and . , ! ? : ' % / ( ) + # - * = < > only; a line holds 30) and the button that flies the
# visitor back out. Click the screen in 3D to fly into it; the game is not there yet.
arcade:
  en:
    title: "DFRNC"
    subtitle: "ARCADE"
    insertCoin: "INSERT COIN"
    hiScore: "HI-SCORE"
    gameOver: "GAME OVER"
    comeCloser: "COME CLOSER"
    game:
      coinHint: "CLICK TO INSERT COIN"
      coinHintTouch: "TAP TO INSERT COIN"
      credit: "CREDIT"
      loading: "LOADING"
      stuck: "STILL LOADING..."
      again: "NICE TRY. STILL 99%"
      soon: "COMING SOON"
      soonNote: "OUR DEV IS STILL ON LEVEL 1"
      scoresTitle: "HIGH SCORES"
      exitHint: "ESC TO LEAVE"
      exitHintTouch: "BACK TO LEAVE"
    scores:
      - { name: BOHDAN, score: 999999, note: "HELD THE HEADING ONE-HANDED" }
      - { name: DIANA, score: 4200, note: "SPILLED THE COFFEE" }
      - { name: YOU, score: 0, note: "JUST GOT HERE" }
    back: "Back to the office"
# The monitor in the office that shows this very landing (wow-plan E5): click its screen in 3D,
# the camera flies into it and you are back at the top of the 2D page. Its picture is the page
# itself; the only text is what it says when clicked from too far away.
monitor:
  en:
    comeCloser: "Come closer"

# The photo mode (wow-plan E7): a header button in 3D. The visitor's hand raises a phone, a
# countdown runs, everyone in the frame turns and poses, click — the picture comes out as a
# comic polaroid with the caption below; "Save" downloads the PNG (on a phone: the share sheet).
photo:
  en:
    button: "Selfie"
    cheese: "Cheese!"
    caption: "Greetings from the DFRNC office"
    save: "Save"
    share: "Share"
    close: "Close"
